<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powersports Capstone | Data Analyst Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-navy: #1a3a5a;   
            --accent-gold: #d4af37;    
            --stone-grey: #f4f4f9;     
            --text-main: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--stone-grey);
            color: var(--text-main);
            line-height: 1.8;
        }

        nav {
            background: var(--primary-navy);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            margin: 0 25px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover { color: var(--accent-gold); }

        .hero {
            height: 45vh;
            background: linear-gradient(rgba(26, 58, 90, 0.6), rgba(26, 58, 90, 0.8)), 
                        url('../castle-bg.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border-bottom: 6px solid var(--accent-gold);
        }

        .hero-content { text-align: center; padding: 20px; }
        .hero h1 { font-size: 2.8rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .hero p { font-size: 1.2rem; color: var(--accent-gold); font-weight: bold; margin-top: 10px; }

        .container {
            max-width: 1000px;
            margin: -60px auto 60px; 
            background: white;
            padding: 60px;
            border-radius: 4px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        h2 {
            color: var(--primary-navy);
            border-left: 5px solid var(--accent-gold);
            padding-left: 15px;
            margin-top: 50px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 1.4rem;
        }

        .artifact-img {
            width: 100%;
            height: auto;
            margin: 25px 0;
            border: 1px solid #ddd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-radius: 4px;
        }

        /* Utility class to downsize individual full-width images (cp3 and cp9) */
        .small-artifact {
            display: block;
            max-width: 60%;
            margin: 25px auto;
        }

        .img-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .img-grid img { width: 100%; border: 1px solid #ddd; border-radius: 4px; }

        /* Custom layout row keeping images side-by-side, but making cp4 narrower than cp5 and cp6 */
        .database-grid {
            display: grid;
            grid-template-columns: 1.2fr 2fr 2fr; 
            gap: 20px;
            margin: 25px 0;
            align-items: start;
        }

        .database-grid img { width: 100%; border: 1px solid #ddd; border-radius: 4px; }

        /* Responsive stack for mobile views */
        @media (max-width: 768px) {
            .database-grid {
                grid-template-columns: 1fr;
            }
            .small-artifact {
                max-width: 100%;
            }
        }

        .highlight-box {
            background: #f0f4f8;
            padding: 30px;
            border-radius: 8px;
            margin: 30px 0;
            border-right: 4px solid var(--primary-navy);
        }

        .back-btn {
            display: inline-block;
            margin-top: 40px;
            color: var(--primary-navy);
            text-decoration: none;
            font-weight: bold;
            border: 2px solid var(--primary-navy);
            padding: 12px 25px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: var(--primary-navy);
            color: white;
        }
